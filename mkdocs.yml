site_name: Polars-Bloomberg
site_description: Fast Polars DataFrame interface for Bloomberg blpapi, covering BDP, BDH, BDIB, BSRCH, and Bloomberg BQL workflows with practical examples.
site_url: https://marekozana.github.io/polars-bloomberg/
repo_url: https://github.com/MarekOzana/polars-bloomberg
repo_name: MarekOzana/polars-bloomberg
edit_uri: edit/main/docs/

theme:
  name: material
  logo: images/polars-bloomberg-logo-512x512.png
  favicon: images/polars-bloomberg-fav-32x32.png
  features:
    - content.code.copy     # copy button on code; recipe outputs opt out with .no-copy
    - navigation.footer     # previous / next page links, to read recipe pages in order
    - navigation.indexes    # "Recipes" in the nav opens recipes/index.md
    - navigation.top        # back-to-top button on long pages
    - toc.follow            # the table of contents follows the scroll
  font:
    text: "Roboto"
    code: "Cascadia Mono" # "Cascadia Mono"
  palette:
    # Light (Polars-ish: blue/white)
    - scheme: default
      primary: blue
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to Bloomberg mode

    # Dark (Bloomberg-ish: dark + orange)
    - scheme: slate
      primary: amber
      accent: gray
      toggle:
        icon: material/weather-sunny
        name: Switch to Polars mode

markdown_extensions:
  - meta
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/recipes.css

plugins:
  - search
  - tags
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
  - mkdocs-jupyter:
      remove_tag_config:
        remove_input_tags:
          - hide_code

hooks:
  - dev/llms_full.py  # writes llms-full.txt from docs/llms.txt at every build


nav:
  - Home: index.md
  - Usage & Tutorials:
    - BDP: usage/bdp.md
    - BDH: usage/bdh.md
    - BDIB: usage/bdib.md
    - BSRCH: usage/bsrch.md
    - BQL: usage/bql.md
  - Recipes:
    - recipes/index.md
    - New Issues: recipes/new-issues.md
    - Dealer Axes: recipes/axes.md
    - Bonds and Capital Structure: recipes/capital-structure.md
    - Spread Statistics: recipes/spreads.md
    - Company Fundamentals: recipes/fundamentals.md
    - Market History with BDH: recipes/history.md
  - Examples:
    - Equity: examples/equity/index.md
    - Credits: examples/credit/index.md
    - Macro: examples/macro/index.md
  - API Reference: api.md
  - Developer Guide: developer-guide.md
